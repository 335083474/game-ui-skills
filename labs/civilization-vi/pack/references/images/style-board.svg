<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Civilization VI cartographic strategy visual reference</title><desc id="desc">An original style board showing a hex map, compact resource strip, branching research nodes, and city queue components.</desc>
<defs><pattern id="mapgrid" width="104" height="90" patternUnits="userSpaceOnUse"><path d="M26 2h52l25 43-25 43H26L1 45z" fill="none" stroke="#e1c77c" stroke-opacity=".32" stroke-width="2"/game-ui-skills/></pattern></defs>
<rect width="1440" height="900" fill="#14212d"/game-ui-skills/><rect x="42" y="42" width="1356" height="816" fill="#1b3041" stroke="#c7a458" stroke-width="2"/game-ui-skills/><text x="84" y="98" fill="#aeb9bf" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">CIVILIZATION VI / CARTOGRAPHIC STRATEGY DIRECTION</text><text x="84" y="155" fill="#ece4ce" font-family="Georgia,serif" font-size="42">Map first. State always visible.</text>
