<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">Fallout 2 original UI style reference</title><desc id="desc">An original vector design board for Fallout 2: material, interface geometry, palette, and hierarchy. No game assets are included.</desc><rect width="1280" height="900" fill="#20231f"/game-ui-skills/><text x="62" y="84" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#e3ddc2">LOCAL UI STUDY / FALLOUT 2</text><text x="62" y="139" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#e3ddc2">Fallout 2 / Atomic-age wasteland instruments</text><rect x="80" y="202" width="606" height="330" rx="0" fill="#77796f" stroke="#20231f" stroke-width="9"/game-ui-skills/><rect x="108" y="231" width="402" height="245" fill="#07110a" stroke="#aaa895" stroke-width="8"/game-ui-skills/><rect x="125" y="248" width="368" height="211" fill="#0b1a0d" stroke="#8de16c" stroke-width="2"/game-ui-skills/><text x="146" y="286" font-family="monospace" font-size="18" fill="#8de16c">CHARACTER / STATUS</text><path d="M146 315h300M146 345h271M146 375h294M146 405h236" stroke="#8de16c" stroke-width="3" opacity=".82"/game-ui-skills/><circle cx="622" cy="322" r="64" fill="#b4ad91" stroke="#292b25" stroke-width="9"/game-ui-skills/><path d="M622 322 652 282" stroke="#a94f36" stroke-width="7"/game-ui-skills/><circle cx="622" cy="322" r="8" fill="#292b25"/game-ui-skills/><g fill="#c8c1a5" stroke="#292b25" stroke-width="4"><circle cx="94" cy="216" r="8"/game-ui-skills/><circle cx="672" cy="216" r="8"/game-ui-skills/><circle cx="94" cy="519" r="8"/game-ui-skills/><circle cx="672" cy="519" r="8"/game-ui-skills/></g><rect x="722" y="227" width="186" height="120" fill="#20231f" stroke="#aaa895" stroke-width="5"/game-ui-skills/><text x="742" y="258" font-family="monospace" font-size="14" fill="#e3ddc2">TRADE / OFFER</text><path d="M742 275h145M742 299h119M742 323h132" stroke="#d5a