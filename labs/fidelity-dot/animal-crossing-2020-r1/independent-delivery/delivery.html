<!doctype html><html lang="zh-CN" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岛民委托交付清单 · 独立功能研究演示</title><link rel="stylesheet" href="delivery.css"></head><body>
<p id="sizeNotice" hidden role="status">画幅不足：需要横屏、实际舞台至少 960 × 540。舞台操作已暂停；下方编辑与导出仍可使用。</p>
<main id="viewport"><section id="stage" aria-label="岛民委托交付清单交互舞台"><img id="scene" src="assets/background.png" alt="">
<div id="head"><span id="heading"></span><span id="requester"></span></div>
<section id="candidatePanel" aria-label="可选物品"><h2>选择要交付的物品</h2><div id="candidateList"></div></section>
<section id="deliveryPanel" aria-label="交付清单"><h2>交付清单 <span id="count"></span></h2><div id="entryList"></div><div id="foot"><span id="subtotal"></span><button id="submit">确认交付 ➜</button></div></section>
<section id="speech" aria-label="岛民留言"><b id="speaker"></b><p id="message"></p></section>
<div id="hints">鼠标点击 / Tab 移动 / Enter 或空格选择</div>
</section></main>
<section class="review" aria-label="研究与数据工具"><p>独立新功能研究演示 · 非原游戏既有界面 · 原冻结包文件保持不变</p><nav><a href="index.html">原随附背包示例</a><a href="shop.html">原随附商店示例</a><button id="reset">恢复演示数据</button><button id="empty">空清单示例</button><button id="low">数量不足示例</button><button id="full">阅读完整文字</button><button id="export">导出 JSON</button></nav><p id="status" role="status" aria-live="polite"></p><details><summary>编辑完整数据 / 导入 JSON</summary><label for="editor">可编辑文案、候选物品、库存、需求量与清单（完整 JSON）</label><textarea id="editor" spellcheck="false"></textarea><button id="apply">校验并应用</button><label>导入本地 JSON <input id="import" type="file" accept=".json,application/json"></label><p id="error" role="alert"></p></details></section>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">确认交付吗？</h2><pre id="confirmText"></pre><div class="dialogActions"><button id="no">B 取消</button><button id="yes">A 确认交付</button></div></dialog>
<dialog id="resultDialog" aria-labelledby="resultTitle"><h2 id="resultTitle">本次交付结果</h2><pre id="resultText"></pre><button id="resultClose">关闭</button></dialog>
<dialog id="fullDialog" aria-labelledby="fullTitle"><h2 id="fullTitle">全部文字与状态</h2><pre id="fullText" tabindex="0"></pre><button id="fullClose">关闭</button></dialog>
<script src="delivery-data.js"></script><script src="delivery.js"></script></body></html>
