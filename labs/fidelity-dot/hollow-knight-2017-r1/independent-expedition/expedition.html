<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远征结算 · 独立研究演示</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="expedition.css"><script defer src="expedition-data.js"></script><script defer src="expedition.js"></script></head>
<body><div class="draft">Independent reference extension · NOT ACCEPTED · NOT FOR SALE · No game-engine connection</div>
<main id="viewport" aria-label="远征结算演示"><p id="sizeNotice" role="status" hidden></p><div id="stage" tabindex="-1"><img class="background" src="assets/background.svg" alt=""><div class="veil"></div><img class="frame" src="assets/frame.svg" alt=""><h1 id="menuTitle"></h1>
<section id="resultHeader" aria-label="远征结果"><div class="ornament" aria-hidden="true">◇ ─── ◇ ─── ◇</div><h2 id="resultHeading"></h2><p id="resultNote" tabindex="0"></p></section>
<section id="statistics" aria-label="本次远征统计"></section>
<section id="rewardArea" aria-labelledby="rewardHeading"><h2 id="rewardHeading">远征奖励</h2><div id="rewardList" role="group" aria-label="奖励选择"></div><div id="rewardDetail"><img id="rewardPreview" alt=""><h3 id="rewardName"></h3><div id="rewardDescription" tabindex="0"></div></div></section>
<nav id="actions" aria-label="结算操作"><button type="button" id="continueButton" class="action"><img src="assets/selection.svg" alt=""><span>继续</span></button><button type="button" id="retryButton" class="action"><img src="assets/selection.svg" alt=""><span>重试</span></button></nav>
</div></main>
<div id="reviewNotice" role="status" aria-live="polite" tabindex="-1"></div><button id="readAll" type="button" hidden>阅读完整文字 / 查看所有字段</button>
<details class="tools"><summary>Review / edit（舞台外数据编辑器）</summary><form id="editor"><label>菜单标题（≤300）<input id="editTitle" maxlength="300"></label><label>当前结果<select id="editOutcome"><option value="success">成功</option><option value="failure">失败</option></select></label><label>成功标题（≤300）<input id="editSuccessHeading" maxlength="300"></label><label>成功说明（≤20000）<textarea id="editSuccessNote" rows="3" maxlength="20000"></textarea></label><label>失败标题（≤300）<input id="editFailureHeading" maxlength="300"></label><label>失败说明（≤20000）<textarea id="editFailureNote" rows="3" maxlength="20000"></textarea></label><div id="statEditor"></div><label>奖励数量（1–6）<select id="rewardCount"></select></label><label>编辑奖励项<select id="editRewardIndex"></select></label><label>奖励名称（≤300）<input id="editRewardName" maxlength="300"></label><label>奖励图标（相对路径，包内资源）<select id="editRewardIcon"></select></label><label>奖励完整说明（≤20000）<textarea id="editRewardDescription" rows="5" maxlength="20000"></textarea></label><div class="editorActions"><button type="submit">应用编辑</button><button id="exportButton" type="button">导出 JSON</button><label>导入 JSON（≤2 MB）<input id="importFile" type="file" accept=".json,application/json"></label></div><p id="editStatus" role="status"></p></form></details>
<dialog id="retryDialog" aria-labelledby="retryHeading" aria-describedby="retryBody"><h2 id="retryHeading">确认重新远征？</h2><p id="retryBody">演示重试将结算结果切换为失败，并保留现有统计与奖励数据。不会修改任何真实游戏数据。</p><div class="dialogActions"><button id="cancelRetry" type="button">取消</button><button id="confirmRetry" type="button">确认重试</button></div></dialog>
<dialog id="infoDialog" aria-labelledby="infoHeading"><h2 id="infoHeading"></h2><pre id="infoBody" tabindex="0"></pre><button id="closeInfo" type="button">关闭 / Esc</button></dialog>
</body></html>
