<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pause & Options — research demonstration</title><link rel="stylesheet" href="shared-style.css"><link rel="stylesheet" href="pause-options.css"><script defer src="pause-options.js"></script></head>
<body><div class="draft">Independent research extension · NOT ACCEPTED · NOT FOR SALE · Pause & Options v0.1 · Dot status repair r1</div>
<main id="viewport" aria-label="暂停与选项演示"><p id="sizeNotice" role="status" hidden></p><div id="stage" tabindex="-1">
<img class="background" src="assets/background.svg" alt=""><div class="veil"></div><img class="frame" src="assets/frame.svg" alt=""><h1 id="menuTitle"></h1>
<section id="pauseView" class="view" aria-label="暂停菜单"><div class="openingMark" aria-hidden="true"><img src="assets/socket.svg" alt=""><span>◇</span><img src="assets/socket.svg" alt=""></div><h2 id="panelHeading">暂停</h2><p id="intro" tabindex="0"></p><nav id="optionList" aria-label="暂停菜单操作"><button class="menuOption" id="continueBtn" type="button"><img src="assets/selection.svg" alt=""><span id="continueText"></span></button><div class="sliderLine"><label id="masterLabel" for="masterRange"></label><input id="masterRange" type="range" min="0" max="100" step="1"><output id="masterValue" for="masterRange"></output></div><div class="sliderLine"><label id="effectsLabel" for="effectsRange"></label><input id="effectsRange" type="range" min="0" max="100" step="1"><output id="effectsValue" for="effectsRange"></output></div><button class="menuOption" id="helpBtn" type="button"><img src="assets/selection.svg" alt=""><span id="helpText"></span></button><button class="menuOption" id="titleBtn" type="button"><img src="assets/selection.svg" alt=""><span id="titleText"></span></button></nav><p class="hint">↑ ↓ 选择　← → 调整音量　Enter 确认　Esc 继续</p></section>
<section id="otherView" class="view" hidden aria-live="polite"><h2 id="otherHeading"></h2><p id="otherDescription"></p><button id="backPause" type="button">返回暂停菜单</button></section></div></main>
<!-- Same status ID and JS handlers; normal document flow outside the scaled stage. -->
<p id="stageStatus" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
<details class="tools"><summary>Review / edit data（舞台外编辑器）</summary><form id="editor"><label>菜单标题（最长 300 字符）<input id="editTitle" maxlength="300"></label><label>说明文字（最长 20000 字符）<textarea id="editIntro" rows="3" maxlength="20000"></textarea></label><label>操作名称：继续游戏<input id="editContinue" maxlength="300"></label><label>操作名称：主音量<input id="editMaster" maxlength="300"></label><label>操作名称：音效音量<input id="editEffects" maxlength="300"></label><label>操作名称：键位说明<input id="editHelp" maxlength="300"></label><label>操作名称：返回标题<input id="editReturn" maxlength="300"></label><label>键位说明（每行一项，最多 20 行；每行最长 300 字符）<textarea id="editKeys" rows="5"></textarea></label><button type="submit">应用编辑</button><button type="button" id="exportBtn">导出 JSON</button><label>导入 JSON<input id="importFile" type="file" accept=".json,application/json"></label><p id="editStatus" role="status"></p></form></details>
<dialog id="helpDialog" aria-labelledby="helpHeading"><h2 id="helpHeading">键位说明</h2><div id="helpBody" tabindex="0"></div><button id="closeHelp" type="button">关闭 / Esc</button></dialog>
<dialog id="confirmDialog" aria-labelledby="confirmHeading" aria-describedby="confirmDescription"><h2 id="confirmHeading">返回标题画面？</h2><p id="confirmDescription">这只是演示状态切换，不会保存、读取或退出真实游戏。</p><div class="dialogActions"><button id="cancelReturn" type="button">取消</button><button id="confirmReturn" type="button">确认返回</button></div></dialog>
<dialog id="fullDialog" aria-labelledby="fullHeading"><h2 id="fullHeading">完整文字</h2><pre id="fullBody" tabindex="0"></pre><button id="closeFull" type="button">关闭</button></dialog>
</body></html>
