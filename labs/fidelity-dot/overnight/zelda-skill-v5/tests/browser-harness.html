<!doctype html><meta charset="utf-8"><title>Recipient-run runtime checks</title><h1>Browser harness — not run by author</h1><p>Serve locally over HTTP if your browser blocks file iframe access. This tests behavior, not visual fidelity.</p><button id="run">Run data / selection / dialog checks</button><pre id="results"></pre><iframe id="app" src="../inventory.html" width="1100" height="1050"></iframe><script>
document.getElementById('run').onclick=()=>{const output=document.getElementById('results'),lines=[];function check(v,name){lines.push((v?'PASS ':'FAIL ')+name);if(!v)throw Error(name)}try{const w=document.getElementById('app').contentWindow,api=w.ZeldaUI,base=api.getData();for(const n of [2,3,4,20]){const d=JSON.parse(JSON.stringify(base));d.items=d.items.slice(0,n);d.selectedIndex=0;api.setData(d);api.select(n-1);check(api.diagnostics().index===n-1,'select last '+n);const c=w.document.getElementById('game');c.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check(api.diagnostics().index===0,'wrap '+n);c.dispatchEvent(new w.KeyboardEvent('keydown',{key:'End',bubbles:true}));check(api.diagnostics().index===n-1,'End '+n)}api.setData(base);api.setScreen('equipment');api.select(1);check(api.diagnostics().index===1,'independent equipment selection');api.confirm();check(w.document.getElementById('dialog').open,'details opens');w.document.getElementById('close').click();check(!w.document.getElementById('dialog').open,'details closes');api.back();check(api.diagnostics().screen==='inventory','back');check(api.getData().selectedIndex===base.selectedIndex,'inventory selection preserved');lines.push('Still review mouse, image load, nearest scaling, long pages, warnings and visual likeness manually')}catch(e){lines.push('ERROR '+e.message)}output.textContent=lines.join('\n')};</script>
