  </g>
  <rect x="36" y="680" width="1126" height="44" fill="#27205e"/><text x="61" y="707" fill="#e8ef9c" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5">ORIGINAL WALLPAPER / WINDOWS / WEB CONTENT / NO FILES DOWNLOADED</text>
