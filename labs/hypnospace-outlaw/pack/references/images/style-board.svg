    <rect x="9" y="48" width="624" height="29" fill="#d7d8d0" stroke="#7e8390"/><text x="21" y="68" fill="#28234d" font-family="Consolas,monospace" font-size="12">URL: http://pondparty.hyp/reef-friends</text>
