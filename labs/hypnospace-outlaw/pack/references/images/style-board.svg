<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Original colorful early-web desktop study</title>
  <desc id="desc">A whimsical teal and violet desktop with bright tiled wallpaper, a beveled browser window, a mail list, and original file icons.</desc>
  <defs>
    <pattern id="wall" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="#25b8c2"/><path d="M0 19 30 0h29L0 58zM120 79 79 120H48l72-72z" fill="#c6ef48"/><circle cx="91" cy="23" r="12" fill="#ff60ac"/><path d="M19 88c10-12 20-12 30 0s20 12 30 0" fill="none" stroke="#7049c8" stroke-width="8"/><path d="M70 50h30v8H70zM70 63h24v8H70z" fill="#fff3a1"/></pattern>
    <linearGradient id="titlebar" x2="0" y2="1"><stop stop-color="#9d76ed"/><stop offset="1" stop-color="#6047b0"/></linearGradient>
    <linearGradient id="button" x2="0" y2="1"><stop stop-color="#f9faf1"/><stop offset=".49" stop-color="#d6d9d1"/><stop offset=".5" stop-color="#b7bcb6"/><stop offset="1" stop-color="#ebeee7"/></linearGradient>
  </defs>
