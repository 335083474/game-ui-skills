    <text x="24" y="140" fill="#383260" font-family="Arial,sans-serif" font-size="9">HypnoMail</text><text x="24" y="153" fill="#383260" font-family="Arial,sans-serif" font-size="8">Weekly note</text><text x="24" y="184" fill="#383260" font-family="Arial,sans-serif" font-size="9">Tadpole77</text><text x="24" y="197" fill="#383260" font-family="Arial,sans-serif" font-size="8">Check link</text>
