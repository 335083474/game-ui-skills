    <path d="M22 93h596v66H22z" fill="#55d7d0"/><text x="321" y="132" text-anchor="middle" fill="#613c9c" font-family="Arial,sans-serif" font-size="32" font-weight="900" letter-spacing="4">WELCOME TO MY REEF!</text>
    <circle cx="96" cy="221" r="31" fill="#ff66ac" stroke="#5c479a" stroke-width="4"/><circle cx="88" cy="214" r="4" fill="#271d54"/><circle cx="105" cy="214" r="4" fill="#271d54"/><path d="M86 228q10 14 20 0" fill="none" stroke="#271d54" stroke-width="4"/>
    <text x="145" y="205" fill="#592ea2" font-family="Arial,sans-serif" font-size="19" font-weight="700">my newest sea pal!</text><text x="145" y="233" fill="#312b60" font-family="Arial,sans-serif" font-size="14">click around &amp; say hi to everyone</text>
    <path d="M53 280h536" stroke="#52b9b3" stroke-width="3" stroke-dasharray="4 4"/><text x="54" y="315" fill="#234e9d" font-family="Arial,sans-serif" font-size="13" text-decoration="underline">reef links</text><text x="165" y="315" fill="#234e9d" font-family="Arial,sans-serif" font-size="13" text-decoration="underline">guestbook</text><text x="294" y="315" fill="#234e9d" font-family="Arial,sans-serif" font-size="13" text-decoration="underline">fish counter</text>
    <text x="55" y="373" fill="#665f90" font-family="Consolas,monospace" font-size="11">[ ORIGINAL SAMPLE PAGE / NO EXTERNAL LINKS ]</text>
