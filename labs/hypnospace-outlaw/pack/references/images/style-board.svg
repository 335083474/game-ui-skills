    <g transform="translate(195 58)"><path d="M0 5h51v63H0z" fill="#ffd66b" stroke="#4d4292" stroke-width="3"/><path d="M5 12h41v10H5z" fill="#b4a0ed"/><text x="25" y="43" text-anchor="middle" fill="#513c98" font-family="Consolas,monospace" font-size="12">.scr</text><text x="25" y="60" text-anchor="middle" fill="#443b7a" font-family="Arial,sans-serif" font-size="7">SCREENSAVER</text></g>
